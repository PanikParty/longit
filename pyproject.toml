[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "long"
version = "0.1.0"
description = "Natural-language interface to git with remote or local LLM backends"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "rich>=13"]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.3"]

[project.scripts]
long = "long.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.build-backend]
module-root = ""
module-name = "long"

[tool.pytest.ini_options]
testpaths = ["tests"]
